name: Package Report
description: Report a problem with a Candy package
labels: ["package-report"]
body:
  - type: markdown
    attributes:
      value: |
        Identify the package and describe the concern. For bugs in Candy itself, use the bug report template. Remove credentials and private content from logs.

  - type: input
    id: package-name
    attributes:
      label: Package name
      description: The npm package name or source URL.
      placeholder: "@scope/package"
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Version
      description: The installed package version or commit.
      placeholder: "0.1.0"
    validations:
      required: false

  - type: dropdown
    id: report-type
    attributes:
      label: What are you reporting?
      options:
        - Malicious or unsafe behavior
        - Impersonation
        - Trademark / TOS Violations
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the concern and include links, logs, or screenshots if helpful.
    validations:
      required: true
