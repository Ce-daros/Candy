name: Contribution Proposal
description: Discuss a change or feature
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Read CONTRIBUTING.md and DESIGN.md in this repository. Describe the task this change enables, the expected interaction, and any effect on existing workflows.

  - type: textarea
    id: what
    attributes:
      label: What do you want to change?
      description: Be specific and concise.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: How? (optional)
      description: Brief technical approach if you have one in mind.
    validations:
      required: false
